apiVersion: v1
kind: ServiceAccount
metadata:
  name: internal-kubectl

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: modify-pods
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: modify-pods-to-sa
subjects:
  - kind: ServiceAccount
    name: internal-kubectl
roleRef:
  kind: Role
  name: modify-pods
  apiGroup: rbac.authorization.k8s.io

---  
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-mariadb-backup
spec:
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cronjob-mariadb-backup
            image: d3fk/mysql-s3-backup:stable
            # Bound the nightly dump so it can't starve a node (mysqldump is mostly
            # I/O; memory kept generous so a large dump+upload won't OOM the backup).
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "1"
                memory: "2Gi"
            args:
            - sh
            - -c
            - mysqldump -u root -h mariadb-service.default.svc.cluster.local --single-transaction --password=${PRD_DB_PASSWORD} scw_PROD > /tmp/dump/databasebackup$(date +%Y-%m-%d).sql && s3cmd put --access_key=${BACKUP_ACCESS_KEY} --secret_key=${BACKUP_SECRET_KEY} --ssl /tmp/dump/databasebackup$(date +%Y-%m-%d).sql s3://sct-backups/DB/MEDIAWIKI/ 
            volumeMounts:
            - name: tmp-volume
              mountPath: /tmp/dump/
            - name: s3-config-vol
              mountPath: /root/.s3cfg
              subPath: .s3cfg
            envFrom:
            - secretRef:
                name: backup-keys
            - secretRef:
                name: prd-db-password
            - secretRef:
                name: bucket-db-password
          volumes:
          - name: tmp-volume
            emptyDir: {}
          - name: s3-config-vol
            configMap:
              name: s3-config
              items:
              - key: ".s3cfg"
                path: ".s3cfg"
          restartPolicy: Never

