---  
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-sitemap
spec:
  schedule: "0 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # concurrencyPolicy: Forbid means a hung run would block the next day's,
      # hence the deadline. The failure mode here is deterministic, so retries
      # past 2 only burn CPU.
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: cronjob-sitemap
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 33
          volumes:
          - name: s3-config-vol
            configMap:
              name: s3-config
              items:
              - key: ".s3cfg"
                path: ".s3cfg"
          # Generated by CI from scripts/, not committed as a manifest.
          # No defaultMode needed: invoked as `sh <file>`, never execed.
          - name: sitemap-script-vol
            configMap:
              name: maintenance-scripts
              items:
              - key: "generate-sitemap.sh"
                path: "generate-sitemap.sh"
          - name: tmp-volume
            emptyDir: {}
          containers:
          - name: cronjob-sitemap
            image: ghcr.io/starcitizentools/mediawiki:smw-26.09.12.668
            # PHP's own memory_limit (--memory-limit in generate-sitemap.sh) must
            # stay well UNDER this cgroup limit: a PHP fatal is logged and exits
            # non-zero, a cgroup
            # OOMKill is a silent SIGKILL. Requests are set explicitly and low so
            # this 1-min/day job reserves 192Mi instead of the full 512Mi on the
            # memory-over-committed 2-node cluster; the limit still caps blast radius.
            resources:
              requests:
                memory: "192Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "0.5"
            volumeMounts:
            - name: tmp-volume
              mountPath: /tmp/dump/
            - name: s3-config-vol
              mountPath: /www-data/.s3cfg
              subPath: .s3cfg
            - name: sitemap-script-vol
              mountPath: /scripts
              readOnly: true
            envFrom:
            - secretRef:
                name: mediawiki-keys
            - secretRef:
                name: prd-db-password
            - secretRef:
                name: bucket-db-password
            - secretRef:
                name: sitemap-keys
            command: ["/bin/sh", "/scripts/generate-sitemap.sh"]