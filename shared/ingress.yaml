apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-controller
data:
  worker-processes: "1"
  allow-snippet-annotations: "true"
  ssl-buffer-size: "16K"
  use-gzip: "false"
  enable-brotli: "true"
  ssl-redirect: "false"
  backend-protocol: "HTTP"
  enable-cors: "true"
  enable-ocsp: "true"
  proxy-body-size: "64M"
  use-forwarded-headers: "true"
  compute-full-forwarded-for: "true"  
  proxy-real-ip-cidr: "143.42.223.0/24,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,104.16.0.0/12,104.24.0.0/14,108.162.192.0/18,131.0.72.0/22,141.101.64.0/18,162.158.0.0/15,172.64.0.0/13,173.245.48.0/20,188.114.96.0/20,190.93.240.0/20,197.234.240.0/22,198.41.128.0/17,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2c0f:f248::/32,2a06:98c0::/29"

  hsts-max-age: "63072000"
  hsts-preload: "true"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: default
  name: nginx-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    # Cloudflare Authenticated Origin Pulls: require client cert from
    # Cloudflare's CA on every TLS connection. Drops traffic that
    # bypasses CF (e.g. direct hits to the Linode LB IP) at the TLS
    # layer, before any application code runs.
    #nginx.ingress.kubernetes.io/auth-tls-secret: "default/cloudflare-origin-ca"
    #nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    #nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    # nginx.ingress.kubernetes.io/configuration-snippet: |
    #   # Ban very old versions of Chrome. For now we're banning up to Chrome 125.
    #   if ($http_user_agent ~* "Chrome/[0-9]{1,2}\.") { return 403; }
    #   if ($http_user_agent ~* "Chrome/(10[0-9]|11[0-9]|12[0-5])\.") { return 403; }
    #   # Ban very old versions of Firefox. For now we're banning up to Firefox 100.
    #   if ($http_user_agent ~* "Firefox/[0-9]{1,2}\.") { return 403; }
    #   if ($http_user_agent ~* "Firefox/100\.") { return 403; }
    #   # Ban very old versions of Windows. For now we're banning up to Windows 7.
    #   if ($http_user_agent ~* "Windows NT [0-5]\.") { return 403; }
    #   if ($http_user_agent ~* "Windows NT 6\.[01]") { return 403; }
    #   # Ban very old versions of Mac OS X. For now we're banning up to Mac OS X 10.6.
    #   if ($http_user_agent ~* "Mac OS X 10\.[0-6]") { return 403; }
spec:
  ingressClassName: nginx
  rules:
    - host: starcitizen.tools
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-service
                port:
                  number: 80
  tls:
    - hosts:
        - starcitizen.tools
      secretName: mediawiki-ingress-cert
    - hosts:
        - www.starcitizen.tools
      secretName: www-mediawiki-ingress-cert
