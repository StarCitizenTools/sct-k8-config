apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
spec:
  version: 7.10.2
  nodeSets:
  - name: elasticsearch
    # Scaled to zero for the OpenSearch migration, NOT deleted: the PVC and its
    # data survive, so rollback is count: 1 plus reverting the CirrusSearch
    # cluster config. Deleting the manifest instead would orphan the object --
    # CI applies without prune -- and destroy that rollback path.
    count: 0
    podTemplate:
      spec:
        initContainers:
        - name: sysctl
          securityContext:
            privileged: true
            runAsUser: 0
          command: ['sh', '-c', 'sysctl -w vm.max_map_count=262144']
    config:
      action.auto_create_index: '.watches,.triggered_watches,.watcher-history-*'
      xpack.security.authc:
          anonymous:
            username: anonymous
            roles: superuser
            authz_exception: false
  http:
    tls:
      selfSignedCertificate:
        disabled: true