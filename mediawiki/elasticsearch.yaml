apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  annotations:
    # Stops the Elasticsearch process for the OpenSearch migration while keeping
    # the Pod and its PVC. ECK holds the pod at an elastic-internal-suspend init
    # container, so the ~2Gi JVM heap is released but nothing is destroyed --
    # rollback is deleting this annotation.
    # NOT count: 0, which the ECK admission webhook rejects outright:
    #   "Elasticsearch needs to have at least one master node"
    eck.k8s.elastic.co/suspend: "elasticsearch-es-elasticsearch-0"
spec:
  version: 7.10.2
  nodeSets:
  - name: elasticsearch
    count: 1
    podTemplate:
      spec:
        initContainers:
        - name: sysctl
          securityContext:
            privileged: true
            runAsUser: 0
          command: ['sh', '-c', 'sysctl -w vm.max_map_count=262144']
    config:
      action.auto_create_index: '.watches,.triggered_watches,.watcher-history-*'
      xpack.security.authc:
          anonymous:
            username: anonymous
            roles: superuser
            authz_exception: false
  http:
    tls:
      selfSignedCertificate:
        disabled: true