---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-mediawiki-jobs
spec:
  strategy:
    rollingUpdate:
      maxSurge: 100%
  selector:
    matchLabels:
      app: php-mediawiki-jobs
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app: php-mediawiki-jobs
    spec:
      securityContext:
        fsGroup: 33
        runAsUser: 33
      containers:
        - name: jobrunner
          image: ghcr.io/starcitizentools/mediawiki:smw-jobrunner-26.06.08.571
          command: ["/bin/sh"]
          args:
            ["-c", "/var/www/html/mediawiki-services-jobrunner/entrypoint.sh"]
          imagePullPolicy: Always
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          envFrom:
            - secretRef:
                name: mediawiki-keys
            - secretRef:
                name: prd-db-password
            - secretRef:
                name: images-keys
            - secretRef:
                name: uex-keys
        - name: jobchron
          image: ghcr.io/starcitizentools/mediawiki:smw-jobrunner-26.06.08.571
          command: ["/bin/sh"]
          args:
            ["-c", "/var/www/html/mediawiki-services-jobrunner/entrypoint.sh"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "50m"
          envFrom:
            - secretRef:
                name: mediawiki-keys
            - secretRef:
                name: prd-db-password
          env:
            - name: RUNNER_TYPE
              value: Chron
