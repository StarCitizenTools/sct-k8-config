apiVersion: v1
kind: Service
metadata:
  name: php-service
spec:
  selector:
    app: php-mediawiki
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 9000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-mediawiki
spec:
  strategy:
    rollingUpdate:
      maxSurge: 100%
  selector:
    matchLabels:
      app: php-mediawiki
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app: php-mediawiki
    spec:
      securityContext:
        fsGroup: 33
      initContainers:
        # SMW schema setup. Lives as an initContainer (not a postStart hook) so
        # its stdout/stderr is captured by the normal log pipeline -- visible in
        # `kubectl logs -c smw-setup-store`, Loki, and the failure-debug job.
        # postStart hook output only lands in the Event message, which is
        # truncated and not shipped anywhere.
        - name: smw-setup-store
          image: starcitizentools/mediawiki:smw-26.05.21.542
          command:
            - /bin/sh
            - -c
            - php /var/www/mediawiki/maintenance/run.php SemanticMediaWiki:setupStore --quiet
          envFrom:
            - secretRef:
                name: mediawiki-keys
            - secretRef:
                name: images-keys
            - secretRef:
                name: prd-db-password
      containers:
        - name: php-mediawiki
          image: starcitizentools/mediawiki:smw-26.05.21.542
          ports:
            - containerPort: 9000
          resources:
            requests:
              memory: "64Mi"
              cpu: "2"
            limits:
              memory: "1.5Gi"
              cpu: "3"
          envFrom:
            - secretRef:
                name: mediawiki-keys
            - secretRef:
                name: images-keys
            - secretRef:
                name: prd-db-password
