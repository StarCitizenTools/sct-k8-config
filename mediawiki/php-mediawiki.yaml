apiVersion: v1
kind: Service
metadata:
  name: php-service
spec:
  selector:
    app: php-mediawiki
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 9000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-mediawiki
spec:
  # 2 replicas spread one-per-node so a node loss leaves a Ready php-fpm serving.
  # Tight fit + single-node-window behaviour explained in PR #33.
  replicas: 2
  strategy:
    rollingUpdate:
      # Capacity-aware for a tight cpu:2 pod (see PR #33).
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: php-mediawiki
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app: php-mediawiki
    spec:
      # Contain a php-fpm RCE: the image already runs as www-data (33), this
      # pins it so a base-image change can't quietly start it as root, and
      # nothing here talks to the Kubernetes API, so don't hand out a token.
      # php-fpm and the tools MediaWiki shells out to (ImageMagick, vips,
      # ffmpeg, pygmentize, git) need no capabilities and run under RuntimeDefault.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 33
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # One pod per node when possible (soft, so it never blocks scheduling).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: php-mediawiki
      # DNS-resolution hardening: fail fast on lookup failures and trim CoreDNS
      # query volume. Mitigation, not a cure -- see PR #32 for rationale.
      dnsConfig:
        options:
          - name: timeout
            value: "2"
          - name: attempts
            value: "2"
          - name: single-request-reopen
          - name: ndots
            value: "2"
      containers:
        - name: php-mediawiki
          image: ghcr.io/starcitizentools/mediawiki:smw-26.10.22.722
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # The image leaves the MediaWiki tree owned by www-data and opcache
            # rechecks files every 60s, so a writable root would let code
            # execution in php-fpm rewrite the wiki's own PHP and keep it
            # served. The only paths MediaWiki writes at runtime are the
            # volumes below: everything else goes to S3, valkey or the DB.
            readOnlyRootFilesystem: true
          volumeMounts:
            # PHP upload bodies, ImageMagick/vips/ffmpeg scratch files and
            # MediaWiki's own temp files (wfTempDir).
            - name: tmp
              mountPath: /tmp
            # $wgCacheDirectory: localisation cache (built per language on
            # first use) and $wgGitInfoCacheDirectory. Empty in the image.
            - name: mw-cache
              mountPath: /var/www/mediawiki/cache
          ports:
            - containerPort: 9000
          # Gate traffic on php-fpm actually listening. TCP-only on purpose: a
          # DB/DNS-dependent probe would NotReady all replicas at once (see PR #33).
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "2"
            limits:
              memory: "1.5Gi"
              cpu: "3"
          envFrom:
            - secretRef:
                name: mediawiki-keys
            - secretRef:
                name: images-keys
            - secretRef:
                name: prd-db-password
            - secretRef:
                name: bucket-db-password
            - secretRef:
                name: uex-keys
      # No sizeLimit: exceeding one evicts the pod, and these held the same
      # data unbounded in the container's writable layer before.
      volumes:
        - name: tmp
          emptyDir: {}
        - name: mw-cache
          emptyDir: {}
