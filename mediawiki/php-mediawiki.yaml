apiVersion: v1
kind: Service
metadata:
  name: php-service
spec:
  selector:
    app: php-mediawiki
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 9000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-mediawiki
spec:
  strategy:
    rollingUpdate:
      maxSurge: 100%
  selector:
    matchLabels:
      app: php-mediawiki
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app: php-mediawiki
    spec:
      securityContext:
        fsGroup: 33
      # DNS-resilience hardening (see 2026-06-19 04:40 UTC outage): during a node
      # network blip, pods on the affected node lost cluster DNS and php-fpm workers
      # hung on getaddrinfo for mariadb-service, producing mass nginx "upstream timed
      # out". These resolver options shorten each failed lookup (timeout:2 attempts:2
      # instead of the 5s x default), avoid the glibc dual A/AAAA stall
      # (single-request-reopen), and cut wasteful search-domain expansion of external
      # FQDNs (ndots:2 vs the default 5) -- which also lightens load on the single
      # CoreDNS replica. This is MITIGATION, not a cure: a full DNS outage still fails.
      # The real fix (NodeLocal DNSCache w/ serve_stale) needs kubectl access to roll
      # out/back safely and is deferred.
      dnsConfig:
        options:
          - name: timeout
            value: "2"
          - name: attempts
            value: "2"
          - name: single-request-reopen
          - name: ndots
            value: "2"
      initContainers:
        # SMW schema setup. Lives as an initContainer (not a postStart hook) so
        # its stdout/stderr is captured by the normal log pipeline -- visible in
        # `kubectl logs -c smw-setup-store`, Loki, and the failure-debug job.
        # postStart hook output only lands in the Event message, which is
        # truncated and not shipped anywhere.
        #
        # SMW 7 dropped the .smw.json upgrade-key file, so this init no longer
        # shares anything with the main container -- setupStore just applies any
        # pending SMW store schema changes against the DB.
        - name: smw-setup-store
          image: ghcr.io/starcitizentools/mediawiki:smw-26.06.18.583
          command:
            - /bin/sh
            - -c
            - php /var/www/mediawiki/maintenance/run.php SemanticMediaWiki:setupStore --quiet
          envFrom:
            - secretRef:
                name: mediawiki-keys
            - secretRef:
                name: images-keys
            - secretRef:
                name: prd-db-password
      containers:
        - name: php-mediawiki
          image: ghcr.io/starcitizentools/mediawiki:smw-26.06.18.583
          ports:
            - containerPort: 9000
          resources:
            requests:
              memory: "64Mi"
              cpu: "2"
            limits:
              memory: "1.5Gi"
              cpu: "3"
          envFrom:
            - secretRef:
                name: mediawiki-keys
            - secretRef:
                name: images-keys
            - secretRef:
                name: prd-db-password
            - secretRef:
                name: uex-keys
