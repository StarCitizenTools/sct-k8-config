apiVersion: v1
kind: Service
metadata:
  name: php-service
spec:
  selector:
    app: php-mediawiki
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 9000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-mediawiki
spec:
  # 2 replicas spread one-per-node so a node loss leaves a Ready php-fpm serving.
  # Tight fit + single-node-window behaviour explained in PR #33.
  replicas: 2
  strategy:
    rollingUpdate:
      # Capacity-aware for a tight cpu:2 pod (see PR #33).
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: php-mediawiki
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app: php-mediawiki
    spec:
      securityContext:
        fsGroup: 33
      # One pod per node when possible (soft, so it never blocks scheduling).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: php-mediawiki
      # DNS-resolution hardening: fail fast on lookup failures and trim CoreDNS
      # query volume. Mitigation, not a cure -- see PR #32 for rationale.
      dnsConfig:
        options:
          - name: timeout
            value: "2"
          - name: attempts
            value: "2"
          - name: single-request-reopen
          - name: ndots
            value: "2"
      containers:
        - name: php-mediawiki
          image: ghcr.io/starcitizentools/mediawiki:smw-26.09.19.678
          ports:
            - containerPort: 9000
          # Gate traffic on php-fpm actually listening. TCP-only on purpose: a
          # DB/DNS-dependent probe would NotReady all replicas at once (see PR #33).
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "2"
            limits:
              memory: "1.5Gi"
              cpu: "3"
          envFrom:
            - secretRef:
                name: mediawiki-keys
            - secretRef:
                name: images-keys
            - secretRef:
                name: prd-db-password
            - secretRef:
                name: bucket-db-password
            - secretRef:
                name: uex-keys
