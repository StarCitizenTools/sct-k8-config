apiVersion: v1
kind: Service
metadata:
  name: php-service
spec:
  selector:
    app: php-mediawiki
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 9000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-mediawiki
spec:
  # 2 replicas + soft hostname spread so a node loss/recycle/network blip leaves
  # a Ready php-fpm serving behind php-service. The single-replica backend's node
  # dying (or being drained) = full backend outage was the 2026-06-18 20:05 UTC
  # failure mode. On this 2-node/4-core cluster the replicas land one-per-node;
  # during a single-node window the replacement may stay Pending (two cpu:2 php
  # pods will not fit one node alongside the DB tier) -- acceptable, since the
  # surviving replica keeps serving with no gap.
  replicas: 2
  strategy:
    rollingUpdate:
      # Capacity-aware: php requests cpu:2 and the cluster is tight, so the old
      # maxSurge:100% could not place surge pods on a rollout. Allow one extra and
      # one unavailable so the roll can make room instead of stalling.
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: php-mediawiki
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app: php-mediawiki
    spec:
      securityContext:
        fsGroup: 33
      # Prefer one replica per node so a single node failure never takes out all
      # of php-fpm. Soft (ScheduleAnyway) so it never deadlocks a rollout or
      # blocks scheduling on the 2-node cluster -- CPU capacity still gates the
      # second pod during single-node windows.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: php-mediawiki
      # DNS-resolution hardening: fail fast on lookup failures and trim CoreDNS
      # query volume. Mitigation, not a cure -- see PR #32 for rationale.
      dnsConfig:
        options:
          - name: timeout
            value: "2"
          - name: attempts
            value: "2"
          - name: single-request-reopen
          - name: ndots
            value: "2"
      initContainers:
        # SMW schema setup. Lives as an initContainer (not a postStart hook) so
        # its stdout/stderr is captured by the normal log pipeline -- visible in
        # `kubectl logs -c smw-setup-store`, Loki, and the failure-debug job.
        # postStart hook output only lands in the Event message, which is
        # truncated and not shipped anywhere.
        #
        # SMW 7 dropped the .smw.json upgrade-key file, so this init no longer
        # shares anything with the main container -- setupStore just applies any
        # pending SMW store schema changes against the DB.
        - name: smw-setup-store
          image: ghcr.io/starcitizentools/mediawiki:smw-26.06.18.583
          command:
            - /bin/sh
            - -c
            - php /var/www/mediawiki/maintenance/run.php SemanticMediaWiki:setupStore --quiet
          envFrom:
            - secretRef:
                name: mediawiki-keys
            - secretRef:
                name: images-keys
            - secretRef:
                name: prd-db-password
      containers:
        - name: php-mediawiki
          image: ghcr.io/starcitizentools/mediawiki:smw-26.06.18.583
          ports:
            - containerPort: 9000
          resources:
            requests:
              memory: "64Mi"
              cpu: "2"
            limits:
              memory: "1.5Gi"
              cpu: "3"
          envFrom:
            - secretRef:
                name: mediawiki-keys
            - secretRef:
                name: images-keys
            - secretRef:
                name: prd-db-password
            - secretRef:
                name: uex-keys
