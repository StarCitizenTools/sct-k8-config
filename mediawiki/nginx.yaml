apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  # 2 replicas + soft hostname spread so an nginx pod or its node failing does not
  # drop the proxy tier in front of php-fpm. nginx is light (cpu:50m) so this fits
  # comfortably and rolls with zero downtime (maxUnavailable:0).
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app: nginx
    spec:
      securityContext:
        fsGroup: 33
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nginx
      # DNS-resolution hardening -- see php-mediawiki.yaml / PR #32.
      dnsConfig:
        options:
          - name: timeout
            value: "2"
          - name: attempts
            value: "2"
          - name: single-request-reopen
          - name: ndots
            value: "2"
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-config
            items:
              - key: config
                path: site.conf
      containers:
        - name: nginx
          image: ghcr.io/starcitizentools/nginx:26.06.18.583
          # command: [nginx-debug, '-g', 'daemon off;']
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "1500m"
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d
