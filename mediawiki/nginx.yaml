apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  # 2 replicas spread one-per-node; gap-free roll via the readiness probe. PR #33.
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 10
  selector:
    matchLabels:
      app: nginx
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app: nginx
    spec:
      securityContext:
        fsGroup: 33
      # Hard one-per-node: a soft preference loses to the scheduler's
      # resource-balance scoring. pod-template-hash counts only the new
      # ReplicaSet mid-roll; Honor leaves a NotReady or cordoned node out of
      # the count so the surviving node can take the replacement.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: nginx
      # DNS-resolution hardening -- see php-mediawiki.yaml / PR #32.
      dnsConfig:
        options:
          - name: timeout
            value: "2"
          - name: attempts
            value: "2"
          - name: single-request-reopen
          - name: ndots
            value: "2"
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-config
            items:
              - key: config
                path: site.conf
      containers:
        - name: nginx
          image: ghcr.io/starcitizentools/nginx:26.09.24.693
          # command: [nginx-debug, '-g', 'daemon off;']
          ports:
            - containerPort: 80
          # Gate traffic on nginx listening (TCP :80); keeps the roll gap-free.
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "1500m"
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d
