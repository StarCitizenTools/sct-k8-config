---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-mw-biweekly
spec:
  schedule: "0 8 1,15 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            # rebuildData below is incremental, not a full re-parse:
            #  --revision-mode   only re-parses entities whose page revision changed
            #                    (smw_rev != latest); the unchanged majority is skipped.
            #  --auto-recovery   checkpoints progress so an OnFailure restart resumes
            #                    instead of starting from entity 0.
            #  --skip-dispose    the daily job already runs disposeOutdatedEntities.
            #  --ignore-exceptions  a bad Lua/parser page is logged + skipped, not fatal.
            # The old `-d 100` was a per-entity 100ms usleep (~7.85h over ~282k entities)
            # and is removed; the cron pod's CPU is bounded by k8s limits instead.
            # A true full rebuild (drift repair) is now an on-demand op:
            #   run.php SemanticMediaWiki:rebuildData --force-update --auto-recovery
            - name: cronjob-mw-biweekly
              image: ghcr.io/starcitizentools/mediawiki:smw-26.08.20.622
              # This job (SemanticMediaWiki:rebuildData over ~282k entities) was the
              # direct trigger of the 2026-06-15 11:40 UTC outage: BestEffort + no
              # limit -> ~4 of 4 cores -> kubelet wedged. The cap is the load-bearing
              # fix. NOTE: the run is also pathologically slow (~7% in 3.5h); the
              # command itself likely needs revisiting (batch size / shallow update).
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
              envFrom:
                - secretRef:
                    name: mediawiki-keys
                - secretRef:
                    name: prd-db-password
                - secretRef:
                    name: images-keys
                - secretRef:
                    name: uex-keys
              command: ["/bin/sh"]
              args:
                - -c
                - >-
                  php /var/www/mediawiki/maintenance/run.php updateSpecialPages --override --only=Ancientpages &&
                  php /var/www/mediawiki/maintenance/run.php updateSpecialPages --override --only=Deadendpages &&
                  php /var/www/mediawiki/maintenance/run.php updateSpecialPages --override --only=Fewestrevisions &&
                  php /var/www/mediawiki/maintenance/run.php updateSpecialPages --override --only=Mostlinked &&
                  php /var/www/mediawiki/maintenance/run.php updateSpecialPages --override --only=Mostrevisions &&
                  php /var/www/mediawiki/maintenance/run.php updateSpecialPages --override --only=Wantedpages &&
                  php /var/www/mediawiki/maintenance/run.php initSiteStats --update --active &&
                  php /var/www/mediawiki/maintenance/run.php SemanticMediaWiki:rebuildData --revision-mode --auto-recovery --skip-dispose --ignore-exceptions --exception-log /tmp/smw-rebuild --report-runtime
                  || echo "[biweekly] rebuildData exited non-zero: logged parser exceptions were skipped, the run still completed -- not failing the job"
                  &&
                  php /var/www/mediawiki/maintenance/run.php SemanticMediaWiki:setupStore --skip-import
          restartPolicy: OnFailure

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-mw-monthly
spec:
  schedule: "0 9 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cronjob-mw-monthly
              image: ghcr.io/starcitizentools/mediawiki:smw-26.08.20.622
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
              envFrom:
                - secretRef:
                    name: mediawiki-keys
                - secretRef:
                    name: prd-db-password
                - secretRef:
                    name: images-keys
                - secretRef:
                    name: uex-keys
              command: ["/bin/sh"]
              args:
                - -c
                - >-
                  php /var/www/mediawiki/maintenance/run.php cleanupUploadStash &&
                  php /var/www/mediawiki/maintenance/run.php cleanupWatchlist --fix &&
                  php /var/www/mediawiki/maintenance/run.php refreshLinks --dfn-only &&
                  php /var/www/mediawiki/maintenance/run.php SemanticMediaWiki:removeDuplicateEntities
          restartPolicy: OnFailure