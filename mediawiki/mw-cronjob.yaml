apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-mw-daily
spec:
  schedule: "15 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # The script runs every step and exits non-zero if any failed, so a retry
      # would re-run the expensive SMW steps that already succeeded. For a daily
      # job the next scheduled run is the retry.
      # restartPolicy: Never (below) rather than OnFailure: with OnFailure the
      # kubelet still fires one in-place restart before the controller honours
      # backoffLimit: 0, and the controller then deletes the pod -- Never gives
      # zero wasted restarts and keeps the failed pod for inspection.
      # The deadline only catches a genuine hang: concurrencyPolicy Forbid plus a
      # 24h schedule already prevent overlap, and these steps have not completed
      # since 2026-08-30 so their real runtime is unknown. Generous on purpose --
      # tripping it SIGKILLs the pod, skipping later steps silently, which is the
      # bug this PR exists to remove. Tighten once a run has been measured.
      backoffLimit: 0
      activeDeadlineSeconds: 21600
      template:
        spec:
          volumes:
            - name: scripts-vol
              configMap:
                name: maintenance-scripts
          containers:
            - name: cronjob-mw-daily
              image: ghcr.io/starcitizentools/mediawiki:smw-26.09.22.682
              # CPU limit caps the CFS quota so this maintenance job can never
              # consume a whole node and starve the kubelet (see 2026-06-15 outage:
              # an unbounded BestEffort biweekly job pinned all 4 cores -> node
              # Ready=Unknown -> 525s). Low requests keep it schedulable on the
              # 2-node cluster and make it the first eviction target under pressure.
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
              envFrom:
                - secretRef:
                    name: mediawiki-keys
                - secretRef:
                    name: prd-db-password
                - secretRef:
                    name: bucket-db-password
                - secretRef:
                    name: images-keys
                - secretRef:
                    name: uex-keys
              volumeMounts:
                - name: scripts-vol
                  mountPath: /scripts
                  readOnly: true
              command: ["/bin/sh", "/scripts/mw-daily.sh"]
          restartPolicy: Never
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-mw-tridaily
spec:
  schedule: "15 4 */3 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cronjob-mw-tridaily
              image: ghcr.io/starcitizentools/mediawiki:smw-26.09.22.682
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
              envFrom:
                - secretRef:
                    name: mediawiki-keys
                - secretRef:
                    name: prd-db-password
                - secretRef:
                    name: bucket-db-password
                - secretRef:
                    name: images-keys
                - secretRef:
                    name: uex-keys
              # Single step, so there is no chain to get wrong and no script.
              # Move it to scripts/ over the shared runner if a second is added.
              command: ["/bin/sh"]
              args:
                - -c
                - >-
                  php /var/www/mediawiki/maintenance/run.php updateSpecialPages
          restartPolicy: OnFailure

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-mw-biweekly
spec:
  schedule: "0 8 1,15 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # activeDeadlineSeconds runs from Job start, so it covers scheduling and
      # the image pull -- cold pulls here have taken ~25 min. Size it for that,
      # never for the steps, which take seconds.
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          volumes:
            - name: scripts-vol
              configMap:
                name: maintenance-scripts
          containers:
            # Steps live in scripts/mw-biweekly.sh.
            - name: cronjob-mw-biweekly
              image: ghcr.io/starcitizentools/mediawiki:smw-26.09.22.682
              # Uncapped, this job wedged a node on 2026-06-15; the cap is why
              # that cannot repeat, so keep one. Requests are reserved on a
              # cluster already tight on memory, so keep them near the real cost.
              # Keep the memory limit above PHP's memory_limit (512M, set in the
              # image) so a runaway reports instead of being OOMKilled silently.
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              envFrom:
                - secretRef:
                    name: mediawiki-keys
                - secretRef:
                    name: prd-db-password
                - secretRef:
                    name: bucket-db-password
                - secretRef:
                    name: images-keys
                - secretRef:
                    name: uex-keys
              volumeMounts:
                - name: scripts-vol
                  mountPath: /scripts
                  readOnly: true
              command: ["/bin/sh", "/scripts/mw-biweekly.sh"]
          restartPolicy: OnFailure

---
