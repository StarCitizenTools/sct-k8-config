apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-mw-daily
spec:
  schedule: "15 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cronjob-mw-daily
              image: ghcr.io/starcitizentools/mediawiki:smw-26.08.20.622
              # CPU limit caps the CFS quota so this maintenance job can never
              # consume a whole node and starve the kubelet (see 2026-06-15 outage:
              # an unbounded BestEffort biweekly job pinned all 4 cores -> node
              # Ready=Unknown -> 525s). Low requests keep it schedulable on the
              # 2-node cluster and make it the first eviction target under pressure.
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
              envFrom:
                - secretRef:
                    name: mediawiki-keys
                - secretRef:
                    name: prd-db-password
                - secretRef:
                    name: images-keys
                - secretRef:
                    name: uex-keys
              command: ["/bin/sh"]
              args:
                - -c
                - >-
                  php /var/www/mediawiki/maintenance/run.php initSiteStats.php --update &&
                  php /var/www/mediawiki/maintenance/run.php CirrusSearch:UpdateSuggesterIndex &&
                  php /var/www/mediawiki/maintenance/run.php SemanticMediaWiki:rebuildData --shallow-update &&
                  php /var/www/mediawiki/maintenance/run.php SemanticMediaWiki:disposeOutdatedEntities &&
                  php /var/www/mediawiki/maintenance/run.php SemanticMediaWiki:rebuildPropertyStatistics &&
                  php /var/www/mediawiki/maintenance/run.php SemanticMediaWiki:rebuildConceptCache --update --create
          restartPolicy: OnFailure
---
