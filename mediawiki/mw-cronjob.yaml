apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-mw-daily
spec:
  schedule: "15 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # The script runs every step and exits non-zero if any failed, so a retry
      # would re-run the expensive SMW steps that already succeeded. For a daily
      # job the next scheduled run is the retry.
      # restartPolicy: Never (below) rather than OnFailure: with OnFailure the
      # kubelet still fires one in-place restart before the controller honours
      # backoffLimit: 0, and the controller then deletes the pod -- Never gives
      # zero wasted restarts and keeps the failed pod for inspection.
      # The deadline only catches a genuine hang: concurrencyPolicy Forbid plus a
      # 24h schedule already prevent overlap, and these steps have not completed
      # since 2026-08-30 so their real runtime is unknown. Generous on purpose --
      # tripping it SIGKILLs the pod, skipping later steps silently, which is the
      # bug this PR exists to remove. Tighten once a run has been measured.
      backoffLimit: 0
      activeDeadlineSeconds: 21600
      template:
        spec:
          volumes:
            - name: scripts-vol
              configMap:
                name: maintenance-scripts
          containers:
            - name: cronjob-mw-daily
              image: ghcr.io/starcitizentools/mediawiki:smw-26.09.09.651
              # CPU limit caps the CFS quota so this maintenance job can never
              # consume a whole node and starve the kubelet (see 2026-06-15 outage:
              # an unbounded BestEffort biweekly job pinned all 4 cores -> node
              # Ready=Unknown -> 525s). Low requests keep it schedulable on the
              # 2-node cluster and make it the first eviction target under pressure.
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
              envFrom:
                - secretRef:
                    name: mediawiki-keys
                - secretRef:
                    name: prd-db-password
                - secretRef:
                    name: images-keys
                - secretRef:
                    name: uex-keys
              volumeMounts:
                - name: scripts-vol
                  mountPath: /scripts
                  readOnly: true
              command: ["/bin/sh", "/scripts/mw-daily.sh"]
          restartPolicy: Never
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-mw-tridaily
spec:
  schedule: "15 4 */3 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cronjob-mw-tridaily
              image: ghcr.io/starcitizentools/mediawiki:smw-26.09.09.651
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
              envFrom:
                - secretRef:
                    name: mediawiki-keys
                - secretRef:
                    name: prd-db-password
                - secretRef:
                    name: images-keys
                - secretRef:
                    name: uex-keys
              # Single step, so there is no chain to get wrong and no script.
              # Move it to scripts/ over the shared runner if a second is added.
              command: ["/bin/sh"]
              args:
                - -c
                - >-
                  php /var/www/mediawiki/maintenance/run.php updateSpecialPages
          restartPolicy: OnFailure

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-mw-biweekly
spec:
  schedule: "0 8 1,15 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # These retries are NEWLY reachable: the old chain's `|| echo` swallowed a
      # failure in every step before rebuildData, so the Job could not fail. A
      # retry re-runs the whole script including rebuildData, and this is the job
      # that wedged a node on 2026-06-15, so bound it. activeDeadlineSeconds is
      # wall-clock across all attempts, so it caps the total either way.
      # restartPolicy stays OnFailure so rebuildData's --auto-recovery can resume
      # an in-place restart after an eviction or OOM kill.
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      template:
        spec:
          volumes:
            - name: scripts-vol
              configMap:
                name: maintenance-scripts
          containers:
            # Steps live in scripts/mw-biweekly.sh; the rebuildData flags are
            # explained there. A true full rebuild (drift repair) stays an
            # on-demand op:
            #   run.php SemanticMediaWiki:rebuildData --force-update --auto-recovery
            - name: cronjob-mw-biweekly
              image: ghcr.io/starcitizentools/mediawiki:smw-26.09.09.651
              # This job (SemanticMediaWiki:rebuildData over ~282k entities) was the
              # direct trigger of the 2026-06-15 11:40 UTC outage: BestEffort + no
              # limit -> ~4 of 4 cores -> kubelet wedged. The cap is the load-bearing
              # fix. NOTE: the run is also pathologically slow (~7% in 3.5h); the
              # command itself likely needs revisiting (batch size / shallow update).
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
              envFrom:
                - secretRef:
                    name: mediawiki-keys
                - secretRef:
                    name: prd-db-password
                - secretRef:
                    name: images-keys
                - secretRef:
                    name: uex-keys
              volumeMounts:
                - name: scripts-vol
                  mountPath: /scripts
                  readOnly: true
              command: ["/bin/sh", "/scripts/mw-biweekly.sh"]
          restartPolicy: OnFailure

---
