apiVersion: v1
kind: Service
metadata:
    name: valkey-service
spec:
    selector:
        app: valkey
    ports:
        - port: 6379
          name: valkey-port
    type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: valkey-pvc
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            # Linode already rounds this up to its 10.46 GB minimum volume (the
            # literal 1Gi was misleading vs a 3gb-capped dataset). 10Gi matches
            # reality; expansion is a no-op/grow on linode-block-storage-retain.
            storage: 10Gi
    storageClassName: linode-block-storage-retain

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: valkey-sts
spec:
    serviceName: valkey-service
    replicas: 1
    selector:
        matchLabels:
            app: valkey
    template:
        metadata:
            labels:
                app: valkey
        spec:
            # Room for the preStop background snapshot (up to 30s to start,
            # ~20-25s to write) before the kubelet escalates to SIGKILL.
            terminationGracePeriodSeconds: 90
            # Never share a node with mariadb.
            affinity:
                podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                        - labelSelector:
                              matchLabels:
                                  app: mariadb
                          topologyKey: kubernetes.io/hostname
            containers:
                - name: valkey
                  image: valkey/valkey:9.2.0-alpine
                  command:
                      - valkey-server
                      - '/usr/local/etc/valkey/valkey.conf'
                  ports:
                      - containerPort: 6379
                        name: valkey
                  resources:
                      requests:
                          # Steady-state working set is ~3.1-3.6 GB; the old 2Gi
                          # request under-counted the pod so the scheduler treated
                          # it as smaller than reality. (maxmemory/limit retune is
                          # deferred until the exporter gives hit-rate visibility.)
                          memory: '3Gi'
                          cpu: '100m'
                      limits:
                          memory: '4Gi'
                          cpu: '1.5'
                  volumeMounts:
                      - name: valkey-pv
                        mountPath: /data
                      - name: valkey-config-volume
                        mountPath: /usr/local/etc/valkey
                  # On SIGTERM valkey writes its final snapshot synchronously (~20s
                  # at ~3 GB) and answers nothing meanwhile; MediaWiki's connects
                  # still succeed, so every cache call waits out its read timeout
                  # and the whole site stalls (2026-11-16). Snapshot in the
                  # background instead, then exit without the blocking save. If no
                  # background save could start or it failed, fall through to the
                  # usual SIGTERM save so durability never drops.
                  lifecycle:
                      preStop:
                          exec:
                              command:
                                  - sh
                                  - -c
                                  - |
                                    started=
                                    for i in $(seq 30); do
                                      if valkey-cli BGSAVE 2>/dev/null | grep -q started; then started=1; break; fi
                                      sleep 1
                                    done
                                    [ -n "$started" ] || exit 0
                                    while valkey-cli INFO persistence | grep -q '^rdb_bgsave_in_progress:1'; do sleep 1; done
                                    if valkey-cli INFO persistence | grep -q '^rdb_last_bgsave_status:ok'; then
                                      valkey-cli SHUTDOWN NOSAVE >/dev/null 2>&1 || true
                                    fi
                                    exit 0
            volumes:
                - name: valkey-pv
                  persistentVolumeClaim:
                      claimName: valkey-pvc
                - name: valkey-config-volume
                  configMap:
                      name: valkey-config
                      items:
                          - key: config
                            path: valkey.conf
