apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-config
data: 
  config : |
    [mysqld]
    innodb_buffer_pool_size = 2G
    innodb_log_file_size=240M
    innodb_log_buffer_size=24M
    innodb_snapshot_isolation=off
    key_buffer_size=364K
    performance_schema=on
    ignore-db-dirs=lost+found