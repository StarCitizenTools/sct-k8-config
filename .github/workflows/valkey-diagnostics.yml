name: Valkey Diagnostics

on:
  workflow_dispatch:
    inputs:
      page_id:
        description: 'MediaWiki page ID to probe (default: 509 / Hull B)'
        required: false
        default: '509'

jobs:
  valkey-info:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4

      - name: Kubernetes Set Context
        uses: Azure/k8s-set-context@v4
        with:
          cluster-type: generic
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Node headroom for valkey pod
        run: |
          NODE=$(kubectl get pod valkey-sts-0 -o jsonpath='{.spec.nodeName}')
          echo "valkey-sts-0 is on node: $NODE"
          echo
          echo "=== Node allocatable (total schedulable capacity) ==="
          kubectl get node "$NODE" -o jsonpath='{.status.allocatable}' | tr ',' '\n'
          echo
          echo
          echo "=== Allocated requests/limits on this node (sum of all pod requests) ==="
          kubectl describe node "$NODE" \
            | sed -n '/Allocated resources:/,/^Events:/p' \
            | head -n -1
          echo
          echo "=== Live memory usage across all nodes ==="
          kubectl top nodes 2>&1 || echo "(metrics-server unavailable)"

      - name: Memory pressure & eviction counters
        run: |
          kubectl exec valkey-sts-0 -- valkey-cli INFO memory \
            | grep -E "^(used_memory_human|used_memory_peak_human|maxmemory_human|maxmemory_policy):"
          echo "---"
          kubectl exec valkey-sts-0 -- valkey-cli INFO stats \
            | grep -E "^(keyspace_hits|keyspace_misses|evicted_keys|expired_keys):"

      - name: Total key count
        run: kubectl exec valkey-sts-0 -- valkey-cli DBSIZE

      - name: Parser cache key count
        run: |
          kubectl exec valkey-sts-0 -- valkey-cli --scan --pattern '*pcache*' \
            | wc -l

      - name: Sample parser cache keys with sizes & TTLs
        run: |
          kubectl exec valkey-sts-0 -- sh -c '
            valkey-cli --scan --pattern "*pcache*" | head -10 | while read -r k; do
              size=$(valkey-cli MEMORY USAGE "$k" 2>/dev/null)
              ttl=$(valkey-cli TTL "$k" 2>/dev/null)
              printf "%-90s size=%s ttl=%s\n" "$k" "$size" "$ttl"
            done
          '

      - name: Top key prefixes by count (where memory is going)
        run: |
          kubectl exec valkey-sts-0 -- sh -c '
            valkey-cli --scan \
              | awk -F: "{print \$1\":\"\$2\":\"\$3}" \
              | sort | uniq -c | sort -rn | head -20
          '

      - name: Probe specific page (page id ${{ inputs.page_id }})
        env:
          PAGE_ID: ${{ inputs.page_id }}
        run: |
          echo "=== All pcache keys for page $PAGE_ID ==="
          kubectl exec valkey-sts-0 -- valkey-cli --scan \
            --pattern "*pcache*:${PAGE_ID}*"
          echo
          echo "=== idoptions for page $PAGE_ID (which option sets are tracked) ==="
          kubectl exec valkey-sts-0 -- valkey-cli GET \
            "scw_PROD-wiki:pcache:idoptions:${PAGE_ID}"
          echo
          echo
          echo "=== Sizes / TTLs for each idhash variant of page $PAGE_ID ==="
          kubectl exec valkey-sts-0 -- env PAGE_ID="$PAGE_ID" sh -c '
            valkey-cli --scan --pattern "*pcache:idhash:${PAGE_ID}-*" | while read -r k; do
              size=$(valkey-cli MEMORY USAGE "$k" 2>/dev/null)
              ttl=$(valkey-cli TTL "$k" 2>/dev/null)
              printf "%-120s size=%s ttl=%s\n" "$k" "$size" "$ttl"
            done
          '
          echo
          echo "=== Embedded saved-at timestamp from each idhash variant ==="
          kubectl exec valkey-sts-0 -- env PAGE_ID="$PAGE_ID" sh -c '
            valkey-cli --scan --pattern "*pcache:idhash:${PAGE_ID}-*" | while read -r k; do
              ts=$(valkey-cli GET "$k" \
                | grep -oE "Saved in parser cache.*revision id [0-9]+" | head -1)
              echo "$k"
              echo "  -> $ts"
            done
          '

      - name: Count keys with duplicate option suffixes (suspected dedupe bug)
        run: |
          kubectl exec valkey-sts-0 -- sh -c '
            total=$(valkey-cli --scan --pattern "*pcache:idhash:*" | wc -l)
            dup_userlang=$(valkey-cli --scan --pattern "*pcache:idhash:*" \
              | grep -cE "!userlang.*!userlang" || true)
            dup_dateformat=$(valkey-cli --scan --pattern "*pcache:idhash:*" \
              | grep -cE "!dateformat.*!dateformat" || true)
            triple_userlang=$(valkey-cli --scan --pattern "*pcache:idhash:*" \
              | grep -cE "!userlang.*!userlang.*!userlang" || true)
            echo "total idhash keys:                   $total"
            echo "with !userlang appearing 2+ times:   $dup_userlang"
            echo "with !userlang appearing 3+ times:   $triple_userlang"
            echo "with !dateformat appearing 2+ times: $dup_dateformat"
          '
