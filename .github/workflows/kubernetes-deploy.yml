name: Mediawiki Kubernetes Cluster Deployment

on:
  push:
    branches:
      - 'smw'
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        id: install

      - uses: actions/checkout@v6
      
      - name: Kubernetes Set Context
        uses: Azure/k8s-set-context@v4
        with:
          cluster-type: generic
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: MEDIAWIKI Secrets
        uses: Azure/k8s-create-secret@v5
        with:
          secret-type: 'generic'
          secret-name: mediawiki-keys
          data: ${{ secrets.MEDIAWIKI_KEYS }}

      - name: PRD_DB_PASSWORD Secret
        uses: Azure/k8s-create-secret@v5
        with:
          secret-type: 'generic'
          secret-name: prd-db-password
          data: ${{ secrets.PRD_DB_PASSWORD }}

      - name: PLAUSIBLE_POSTGRES Secret
        uses: Azure/k8s-create-secret@v5
        with:
          secret-type: 'generic'
          secret-name: plausible-postgres
          data: ${{ secrets.PLAUSIBLE_POSTGRES }}

      - name: PLAUSIBLE_CONFIG Secret
        uses: Azure/k8s-create-secret@v5
        with:
          secret-type: 'generic'
          secret-name: plausible-config
          data: ${{ secrets.PLAUSIBLE_CONFIG }}
      
      - name: BACKUP_KEYS Secret
        uses: Azure/k8s-create-secret@v5
        with:
          secret-type: 'generic'
          secret-name: backup-keys
          data: ${{ secrets.BACKUP_KEYS }}

      - name: IMAGES_KEYS Secret
        uses: Azure/k8s-create-secret@v5
        with:
          secret-type: 'generic'
          secret-name: images-keys
          data: ${{ secrets.IMAGES_KEYS }}

      - name: SITEMAP_KEYS Secret
        uses: Azure/k8s-create-secret@v5
        with:
          secret-type: 'generic'
          secret-name: sitemap-keys
          data: ${{ secrets.SITEMAP_KEYS }}

      - name: CLOUDFLARE_API Secret
        uses: Azure/k8s-create-secret@v5
        with:
          namespace: 'cert-manager'
          secret-type: 'generic'
          secret-name: cloudflare-api-key
          data: ${{ secrets.CLOUDFLARE_API }}

      - name: Deploy to Kubernetes cluster
        uses: Azure/k8s-deploy@v5
        with:
          # Path to the manifest files which will be used for deployment.
          manifests: |
            mediawiki
            plausible
            shared
          strategy: basic
          action: deploy

      - name: Restart workloads with changed ConfigMaps
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Kubernetes does not natively roll a workload when its mounted
          # ConfigMap data changes -- the file on disk updates within ~60s
          # but the process inside the container has no idea. Detect changed
          # ConfigMap files in this push and trigger a rolling restart of
          # the consuming workloads.

          if [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "No previous SHA (branch-create or initial push); skipping auto-restart."
            exit 0
          fi

          if ! changed=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${AFTER_SHA}" --jq '.files[].filename' 2>&1); then
            echo "Failed to enumerate changed files: ${changed}"
            echo "Skipping auto-restart."
            exit 0
          fi

          echo "Changed files in this push:"
          printf '  %s\n' ${changed:-"(none)"}

          # Map: tracked ConfigMap file -> workload that needs a restart.
          declare -A CM_TO_WORKLOAD=(
            ["mediawiki/nginx-config.yaml"]="deployment/nginx"
            ["mediawiki/mariadb-config.yaml"]="statefulset/mariadb-sts"
            ["mediawiki/valkey-config.yaml"]="statefulset/valkey-sts"
          )

          declare -A to_restart
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            w="${CM_TO_WORKLOAD[$f]:-}"
            [[ -z "$w" ]] && continue
            to_restart["$w"]=1
          done <<< "$changed"

          if [[ ${#to_restart[@]} -eq 0 ]]; then
            echo "No tracked ConfigMap changes; nothing to restart."
            exit 0
          fi

          for w in "${!to_restart[@]}"; do
            echo "::group::Rolling restart $w"
            kubectl rollout restart "$w"
            kubectl rollout status "$w" --timeout=180s
            echo "::endgroup::"
          done
  debug:
    runs-on: ubuntu-latest
    needs: docker
    if: failure()
    steps:
      - uses: azure/setup-kubectl@v4
        id: install

      - name: Kubernetes Set Context
        uses: Azure/k8s-set-context@v4
        with:
          cluster-type: generic
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
      
      - name: Describe Deployments & ReplicaSets
        run: |
          for app in php-mediawiki php-mediawiki-jobs; do
            echo "--- Deployment/$app ---"
            kubectl describe deployment "$app" || echo "Could not describe deployment $app"
            echo "--- ReplicaSets for $app ---"
            kubectl get rs -l "app=$app" -o wide || echo "Could not get rs for $app"
          done

      - name: Recent Warning Events
        run: |
          kubectl get events --sort-by=.lastTimestamp --field-selector type!=Normal | tail -100 || true

      - name: Get Pod Names
        id: get-pod-names
        run: |
          POD_NAMES=$(kubectl get pods -l 'app in (php-mediawiki,php-mediawiki-jobs)' -o jsonpath='{.items[*].metadata.name}')
          echo "POD_NAMES=$POD_NAMES" >> $GITHUB_OUTPUT

      - name: Get Pod Logs
        run: |
          for pod in ${{ steps.get-pod-names.outputs.POD_NAMES }}; do
            echo "--- Logs for $pod ---"
            kubectl logs "$pod" --all-containers=true --tail=500 || echo "Could not get logs for $pod"
            echo "--- Previous logs for $pod (if any) ---"
            kubectl logs "$pod" --all-containers=true --previous --tail=500 2>/dev/null || echo "(no previous logs)"
          done

      - name: Describe Pods
        run: |
          for pod in ${{ steps.get-pod-names.outputs.POD_NAMES }}; do
            echo "--- Describe for $pod ---"
            kubectl describe pod "$pod" || echo "Could not describe $pod"
          done
