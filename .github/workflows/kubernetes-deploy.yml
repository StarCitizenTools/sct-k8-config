name: Mediawiki Kubernetes Cluster Deployment

on:
  push:
    branches:
      - 'smw'
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      # kubectl pinned to the cluster's minor (apiserver v1.34.x) -- unpinned resolves
      # to latest stable, outside the supported +/-1 skew. Bump when LKE upgrades.
      - uses: azure/setup-kubectl@v5
        id: install
        with:
          version: '1.34'

      - uses: actions/checkout@v7
      
      - name: Kubernetes Set Context
        uses: Azure/k8s-set-context@v5
        with:
          cluster-type: generic
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: MEDIAWIKI Secrets
        uses: Azure/k8s-create-secret@v6
        with:
          secret-type: 'generic'
          secret-name: mediawiki-keys
          data: ${{ secrets.MEDIAWIKI_KEYS }}

      # UEX_APITOKEN must be stored as a JSON object -- the action runs the
      # input through JSON.parse -- with the key UEX_APITOKEN, which is the
      # env var LocalSettings reads via getenv() and that envFrom exposes:
      #   {"UEX_APITOKEN":"<token>"}
      - name: UEX_APITOKEN Secret
        uses: Azure/k8s-create-secret@v6
        with:
          secret-type: 'generic'
          secret-name: uex-keys
          string-data: ${{ secrets.UEX_APITOKEN }}

      - name: PRD_DB_PASSWORD Secret
        uses: Azure/k8s-create-secret@v6
        with:
          secret-type: 'generic'
          secret-name: prd-db-password
          data: ${{ secrets.PRD_DB_PASSWORD }}

      - name: PLAUSIBLE_POSTGRES Secret
        uses: Azure/k8s-create-secret@v6
        with:
          secret-type: 'generic'
          secret-name: plausible-postgres
          data: ${{ secrets.PLAUSIBLE_POSTGRES }}

      - name: PLAUSIBLE_CONFIG Secret
        uses: Azure/k8s-create-secret@v6
        with:
          secret-type: 'generic'
          secret-name: plausible-config
          data: ${{ secrets.PLAUSIBLE_CONFIG }}
      
      - name: BACKUP_KEYS Secret
        uses: Azure/k8s-create-secret@v6
        with:
          secret-type: 'generic'
          secret-name: backup-keys
          data: ${{ secrets.BACKUP_KEYS }}

      - name: IMAGES_KEYS Secret
        uses: Azure/k8s-create-secret@v6
        with:
          secret-type: 'generic'
          secret-name: images-keys
          data: ${{ secrets.IMAGES_KEYS }}

      - name: SITEMAP_KEYS Secret
        uses: Azure/k8s-create-secret@v6
        with:
          secret-type: 'generic'
          secret-name: sitemap-keys
          data: ${{ secrets.SITEMAP_KEYS }}

      - name: CLOUDFLARE_API Secret
        uses: Azure/k8s-create-secret@v6
        with:
          namespace: 'cert-manager'
          secret-type: 'generic'
          secret-name: cloudflare-api-key
          data: ${{ secrets.CLOUDFLARE_API }}

      # Authenticate image pulls against Docker Hub. Anonymous pulls share the
      # node's IP rate limit, which has throttled a cold pull to ~25min and
      # blown the deploy's rollout timeout. A personal read-only token lifts
      # pulls to the higher per-account limit -- image ownership is irrelevant,
      # this only needs a valid Docker Hub identity.
      - name: Docker Hub pull secret
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          kubectl create secret docker-registry dockerhub-pull \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DOCKERHUB_USERNAME" \
            --docker-password="$DOCKERHUB_TOKEN" \
            --namespace=default \
            --dry-run=client -o yaml | kubectl apply -f -

      # Our app images (starcitizentools/*) live in GHCR as private packages,
      # so the kubelet needs credentials to pull them. Uses a read:packages
      # PAT; this can be dropped if the packages are ever made public.
      - name: GHCR pull secret
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          kubectl create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --namespace=default \
            --dry-run=client -o yaml | kubectl apply -f -

      # Attach both pull secrets to the service accounts every pod runs as, so
      # docker.io and ghcr.io pulls authenticate without editing individual
      # manifests. imagePullSecrets on a SA only applies to newly-created pods,
      # so this takes effect on each workload's next rollout (the deploy below).
      - name: Attach pull secret to service accounts
        run: |
          set -euo pipefail
          for sa in default internal-kubectl; do
            if kubectl get serviceaccount "$sa" -n default >/dev/null 2>&1; then
              kubectl patch serviceaccount "$sa" -n default \
                -p '{"imagePullSecrets":[{"name":"dockerhub-pull"},{"name":"ghcr-pull"}]}'
              echo "Patched serviceaccount/$sa with imagePullSecrets."
            else
              echo "::warning::serviceaccount/$sa not found; skipping (will inherit on a later run)."
            fi
          done

      # Authenticate the runner too, so the tag-existence inspects below use
      # the per-account Docker Hub limit instead of the shared runner-IP one.
      - name: Docker Hub login (runner)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      # Also log into GHCR so the tag-existence inspects below can read our
      # private app-image packages.
      - name: GHCR login (runner)
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      # Guard 1: fail fast if any manifest references an image tag that does
      # not exist in the registry. A typo'd/non-existent tag otherwise leaves
      # the pod stuck in ImagePullBackOff until the rollout times out.
      - name: Verify image tags exist
        run: |
          set -euo pipefail
          # Uncommented `image:` lines only (a leading `#` fails the anchor).
          mapfile -t images < <(
            grep -rhE '^[[:space:]]*image:[[:space:]]*[^[:space:]#]+' mediawiki plausible shared \
              | sed -E 's/^[[:space:]]*image:[[:space:]]*//; s/[[:space:]].*$//; s/^["'\'']//; s/["'\'']$//' \
              | sort -u
          )
          echo "Checking ${#images[@]} unique image references..."
          fail=0
          for ref in "${images[@]}"; do
            [ -z "$ref" ] && continue
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "  ok:      $ref"
            else
              echo "  MISSING: $ref"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more image tags do not exist in the registry. Aborting before deploy."
            exit 1
          fi

      # Guard 2: pre-pull a changed StatefulSet image onto its target node
      # BEFORE k8s-deploy rolls the workload. These DB pods are node-pinned
      # (PVC) and single-replica, so a cold first-time pull (Docker Hub
      # anonymous-pull throttling has been seen to take ~25min) blows past the
      # k8s-deploy rollout timeout and fails the deploy with the DB down.
      # Warming the node cache first keeps the pull off the rollout's clock;
      # the old pod keeps serving throughout this step.
      - name: Pre-pull changed StatefulSet images
        run: |
          set -euo pipefail
          # workload -> "manifest file|image-repo needle"
          declare -A STS=(
            ["statefulset/mariadb-sts"]="mediawiki/mariadb.yaml|mariadb:"
            ["statefulset/valkey-sts"]="mediawiki/valkey.yaml|valkey/valkey:"
          )
          for wl in "${!STS[@]}"; do
            IFS='|' read -r file needle <<<"${STS[$wl]}"
            name="${wl#statefulset/}"
            desired=$(grep -hE "^[[:space:]]*image:[[:space:]]*${needle}" "$file" \
              | head -1 | sed -E 's/^[[:space:]]*image:[[:space:]]*//; s/[[:space:]].*$//')
            if [ -z "$desired" ]; then
              echo "::warning::Could not find ${needle}* image in ${file}; skipping ${wl}."
              continue
            fi
            running=$(kubectl get "$wl" -o jsonpath='{.spec.template.spec.containers[*].image}' 2>/dev/null \
              | tr ' ' '\n' | grep -E "^${needle}" | head -1 || true)
            if [ "$desired" = "$running" ]; then
              echo "${wl} already at ${desired}; no pre-pull needed."
              continue
            fi
            node=$(kubectl get pod "${name}-0" -o jsonpath='{.spec.nodeName}' 2>/dev/null || true)
            if [ -z "$node" ]; then
              echo "::warning::Could not determine node for ${name}-0; skipping pre-pull (deploy will pull inline)."
              continue
            fi
            echo "::group::Pre-pull ${wl}: ${running:-<none>} -> ${desired} on ${node}"
            job="prepull-${name}"
            kubectl delete job "$job" --ignore-not-found
            cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${job}
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 120
            template:
              spec:
                nodeName: ${node}
                restartPolicy: Never
                containers:
                  - name: prepull
                    image: ${desired}
                    imagePullPolicy: IfNotPresent
                    command: ["/bin/sh", "-c", "exit 0"]
          EOF
            echo "Waiting for image pull on ${node} (up to 30m)..."
            if ! kubectl wait --for=condition=complete "job/${job}" --timeout=1800s; then
              echo "::error::Pre-pull job ${job} did not complete; image may be unpullable or the pull is stuck."
              kubectl describe "job/${job}" || true
              kubectl delete job "${job}" --ignore-not-found
              exit 1
            fi
            kubectl delete job "${job}" --ignore-not-found
            echo "Pre-pull complete: ${desired} cached on ${node}."
            echo "::endgroup::"
          done

      # Guard 3: warm changed Deployment images on EVERY node before the
      # rollout. Unlike the StatefulSets above, Deployment pods (nginx,
      # php-mediawiki, jobs) are not node-pinned -- a surge pod can land on any
      # node, so an inline first-pull would run on the rollout's 10m clock.
      # Pulling ahead keeps it off that clock; and because each pull is pinned
      # to a node, a node whose runtime is wedged (Ready but unable to start
      # pods -- the 2026-06-06 failure mode) surfaces here as a named warning
      # instead of an opaque rollout timeout. Best-effort: a stuck node warns
      # but does not fail the deploy, since the surge pod may still schedule
      # onto a healthy node. No secrets are emitted -- only image and node names.
      - name: Pre-pull changed Deployment images (all nodes)
        run: |
          set -euo pipefail
          # workload -> "manifest file|image-repo needle" (needle is unique per file)
          declare -A DEPLOY=(
            ["nginx"]="mediawiki/nginx.yaml|ghcr.io/starcitizentools/nginx:"
            ["php-mediawiki"]="mediawiki/php-mediawiki.yaml|ghcr.io/starcitizentools/mediawiki:smw-"
            ["php-mediawiki-jobs"]="mediawiki/php-mediawiki-jobs.yaml|ghcr.io/starcitizentools/mediawiki:smw-jobrunner-"
          )

          # Collect desired images that differ from what each Deployment runs now.
          changed_images=()
          for name in "${!DEPLOY[@]}"; do
            IFS='|' read -r file needle <<<"${DEPLOY[$name]}"
            desired=$(grep -hE "^[[:space:]]*image:[[:space:]]*${needle}" "$file" \
              | head -1 | sed -E 's/^[[:space:]]*image:[[:space:]]*//; s/[[:space:]].*$//')
            if [ -z "$desired" ]; then
              echo "::warning::Could not find ${needle}* image in ${file}; skipping ${name}."
              continue
            fi
            running=$(kubectl get deployment "$name" \
              -o jsonpath='{.spec.template.spec.containers[*].image}{" "}{.spec.template.spec.initContainers[*].image}' 2>/dev/null \
              | tr ' ' '\n' | grep -E "^${needle}" | head -1 || true)
            if [ "$desired" = "$running" ]; then
              echo "${name} already at ${desired}; no pre-pull needed."
            else
              echo "${name}: ${running:-<none>} -> ${desired} (will warm)."
              changed_images+=("$desired")
            fi
          done

          if [ "${#changed_images[@]}" -eq 0 ]; then
            echo "No changed Deployment images; nothing to pre-pull."
            exit 0
          fi

          # Render one no-op container per image (printf keeps indentation exact,
          # independent of this YAML block's own indentation).
          containers_yaml=""
          idx=0
          for img in "${changed_images[@]}"; do
            containers_yaml+=$(printf '        - name: pull-%s\n          image: %s\n          imagePullPolicy: IfNotPresent\n          command: ["/bin/sh", "-c", "exit 0"]\n' "$idx" "$img")
            containers_yaml+=$'\n'
            idx=$((idx + 1))
          done

          # One pull Job per node, pinned via nodeName. The pod inherits the
          # default SA's imagePullSecrets (patched earlier), so private GHCR
          # pulls authenticate.
          node_idx=0
          for node in $(kubectl get nodes -o jsonpath='{.items[*].metadata.name}'); do
            job="prepull-deploy-${node_idx}"
            node_idx=$((node_idx + 1))
            echo "::group::Warm ${#changed_images[@]} image(s) on ${node}"
            kubectl delete job "$job" --ignore-not-found
            printf 'apiVersion: batch/v1\nkind: Job\nmetadata:\n  name: %s\nspec:\n  backoffLimit: 0\n  ttlSecondsAfterFinished: 120\n  template:\n    spec:\n      nodeName: %s\n      restartPolicy: Never\n      containers:\n%s' \
              "$job" "$node" "$containers_yaml" | kubectl apply -f -
            # The 5m is spent on ANY non-completion: an unpullable image
            # (backoffLimit 0 -> Job goes Failed, which `condition=complete`
            # does not short-circuit on) costs the full timeout too, not only a
            # wedged node. Bounded either way; best-effort, so we warn and move on.
            if ! kubectl wait --for=condition=complete "job/${job}" --timeout=300s; then
              echo "::warning::Pre-pull did not complete on ${node} within 5m -- the node may be unable to pull images or start pods (run 'kubectl describe node ${node}'). Continuing; the rollout may still place pods on a healthy node."
              kubectl describe "job/${job}" || true
            fi
            kubectl delete job "${job}" --ignore-not-found
            echo "::endgroup::"
          done

      - name: Deploy to Kubernetes cluster
        uses: Azure/k8s-deploy@v7
        with:
          # Path to the manifest files which will be used for deployment.
          manifests: |
            mediawiki
            plausible
            shared
          strategy: basic
          action: deploy

      - name: Restart workloads with changed ConfigMaps
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # NOTE: deliberately not using `set -u` -- bash errors on
          # ${#assoc_array[@]} when the associative array has never had
          # an element assigned, which breaks the "nothing to restart"
          # path of this script. -e and pipefail are enough for safety.
          set -eo pipefail

          # Kubernetes does not natively roll a workload when its mounted
          # ConfigMap data changes -- the file on disk updates within ~60s
          # but the process inside the container has no idea. Detect changed
          # ConfigMap files in this push and trigger a rolling restart of
          # the consuming workloads.

          if [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "No previous SHA (branch-create or initial push); skipping auto-restart."
            exit 0
          fi

          if ! changed=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${AFTER_SHA}" --jq '.files[].filename' 2>&1); then
            echo "Failed to enumerate changed files: ${changed}"
            echo "Skipping auto-restart."
            exit 0
          fi

          echo "Changed files in this push:"
          printf '  %s\n' ${changed:-"(none)"}

          # Map: tracked ConfigMap file -> workload that needs a restart.
          declare -A CM_TO_WORKLOAD=(
            ["mediawiki/nginx-config.yaml"]="deployment/nginx"
            ["mediawiki/mariadb-config.yaml"]="statefulset/mariadb-sts"
            ["mediawiki/valkey-config.yaml"]="statefulset/valkey-sts"
          )

          declare -A to_restart
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            w="${CM_TO_WORKLOAD[$f]:-}"
            [[ -z "$w" ]] && continue
            to_restart["$w"]=1
          done <<< "$changed"

          if [[ ${#to_restart[@]} -eq 0 ]]; then
            echo "No tracked ConfigMap changes; nothing to restart."
            exit 0
          fi

          for w in "${!to_restart[@]}"; do
            echo "::group::Rolling restart $w"
            kubectl rollout restart "$w"
            kubectl rollout status "$w" --timeout=180s
            echo "::endgroup::"
          done
  debug:
    runs-on: ubuntu-latest
    needs: docker
    if: failure()
    steps:
      # kubectl pinned to the cluster's minor (apiserver v1.34.x) -- unpinned resolves
      # to latest stable, outside the supported +/-1 skew. Bump when LKE upgrades.
      - uses: azure/setup-kubectl@v5
        id: install
        with:
          version: '1.34'

      - name: Kubernetes Set Context
        uses: Azure/k8s-set-context@v5
        with:
          cluster-type: generic
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
      
      # A rollout can also fail because of the node a pod lands on, not the
      # workload itself -- a node that reports Ready while its container runtime
      # is wedged leaves new pods stuck in ContainerCreating/PodInitializing
      # with no Warning event (seen 2026-06-06). Dump node health and where the
      # not-Running pods are scheduled so a bad node is obvious. describe/get
      # only expose Secret *names*, never values, so this is safe to log.
      - name: Node health & pod placement
        run: |
          echo "--- Nodes ---"
          kubectl get nodes -o wide || true
          echo "--- Node conditions & pressure ---"
          kubectl describe nodes || true
          echo "--- App pods (with node) ---"
          kubectl get pods -o wide -l 'app in (nginx,php-mediawiki,php-mediawiki-jobs)' || true
          echo "--- Pods not Running, all namespaces (with node) ---"
          kubectl get pods -A -o wide --field-selector=status.phase!=Running || true

      - name: Describe Deployments & ReplicaSets
        run: |
          for app in nginx php-mediawiki php-mediawiki-jobs; do
            echo "--- Deployment/$app ---"
            kubectl describe deployment "$app" || echo "Could not describe deployment $app"
            echo "--- ReplicaSets for $app ---"
            kubectl get rs -l "app=$app" -o wide || echo "Could not get rs for $app"
          done

      - name: Recent Warning Events
        run: |
          # Default table output truncates .message, which is exactly where
          # postStart-hook stderr and other failure details live. Emit full
          # messages via jsonpath instead.
          kubectl get events --sort-by=.lastTimestamp --field-selector type!=Normal \
            -o jsonpath='{range .items[*]}{.lastTimestamp}{"\t"}{.type}{"\t"}{.reason}{"\t"}{.involvedObject.kind}/{.involvedObject.name}{"\t"}{.message}{"\n"}{end}' \
            | tail -100 || true

      - name: Get Pod Names
        id: get-pod-names
        run: |
          POD_NAMES=$(kubectl get pods -l 'app in (nginx,php-mediawiki,php-mediawiki-jobs)' -o jsonpath='{.items[*].metadata.name}')
          echo "POD_NAMES=$POD_NAMES" >> $GITHUB_OUTPUT

      - name: Get Pod Logs
        run: |
          for pod in ${{ steps.get-pod-names.outputs.POD_NAMES }}; do
            echo "--- Logs for $pod ---"
            kubectl logs "$pod" --all-containers=true --tail=500 || echo "Could not get logs for $pod"
            echo "--- Previous logs for $pod (if any) ---"
            kubectl logs "$pod" --all-containers=true --previous --tail=500 2>/dev/null || echo "(no previous logs)"
          done

      - name: Describe Pods
        run: |
          for pod in ${{ steps.get-pod-names.outputs.POD_NAMES }}; do
            echo "--- Describe for $pod ---"
            kubectl describe pod "$pod" || echo "Could not describe $pod"
          done
