name: Delete a stuck pod

# Deletes a single pod so its controller recreates it from the CURRENT spec.
#
# Why this is needed with GitOps-only access: a StatefulSet using the default
# podManagementPolicy: OrderedReady will not roll a pod that is not Running AND
# Ready. A pod stuck in Init:CrashLoopBackOff therefore blocks its own
# replacement -- CI applies the fixed manifest, the StatefulSet object updates,
# and nothing ever acts on it. Deleting the pod is the only way out, and
# `kubectl rollout restart` does not help because it hits the same wait.
#
# SAFETY:
#   * Deletes ONE pod by exact name. Deployments/StatefulSets recreate it
#     immediately from whatever spec is currently applied.
#   * Data on a PersistentVolumeClaim is NOT touched -- the PVC outlives the pod.
#   * Gated behind a typed confirmation matching the pod name, so a wrong entry
#     in the box cannot delete a pod you did not mean to name.
#   * Refuses names that do not look like a pod in the default namespace.
#
# This is a recovery lever, not routine maintenance. For CronJob-spawned Jobs
# use "Abort maintenance job"; for the ES data-volume case use
# "Elasticsearch Recover", which also handles the stale VolumeAttachment.
on:
  workflow_dispatch:
    inputs:
      pod:
        description: Exact pod name to delete (e.g. opensearch-0)
        required: true
        type: string
      confirm:
        description: Type the pod name again to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: delete-stuck-pod
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      POD: ${{ inputs.pod }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      # kubectl pinned to the cluster's minor (apiserver v1.34.x) -- unpinned resolves
      # to latest stable, outside the supported +/-1 skew. Bump when LKE upgrades.
      - uses: azure/setup-kubectl@v5
        with:
          version: '1.34'

      - name: Kubernetes Set Context
        uses: Azure/k8s-set-context@v5
        with:
          cluster-type: generic
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Confirm
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "$POD" ]; then
            echo "::error::confirm ('$CONFIRM') must exactly match the pod name ('$POD')."
            exit 1
          fi
          # A pod name is a DNS-1123 subdomain. Reject anything else rather than
          # handing an arbitrary string to kubectl delete.
          case "$POD" in
            *[!a-z0-9.-]*|-*|*-|'')
              echo "::error::'$POD' is not a valid pod name."
              exit 1 ;;
          esac

      - name: Show what will be deleted
        run: |
          set -euo pipefail
          if ! kubectl get pod "$POD" -n default >/dev/null 2>&1; then
            echo "::error::Pod '$POD' not found in namespace default."
            exit 1
          fi
          kubectl get pod "$POD" -n default -o wide
          echo
          echo "owner (this is what will recreate it):"
          kubectl get pod "$POD" -n default \
            -o jsonpath='{range .metadata.ownerReferences[*]}  {.kind}/{.name}{"\n"}{end}'
          echo
          echo "init container states:"
          kubectl get pod "$POD" -n default \
            -o jsonpath='{range .status.initContainerStatuses[*]}  {.name}: ready={.ready} state={.state}{"\n"}{end}'

      - name: Delete
        run: |
          set -euo pipefail
          kubectl delete pod "$POD" -n default --wait=false
          echo "Deleted '$POD'. Its controller will recreate it from the current spec."

      - name: Show the replacement
        run: |
          set -uo pipefail
          # Best-effort: the replacement may still be pulling or initialising.
          for _ in $(seq 1 30); do
            sleep 10
            kubectl get pod "$POD" -n default -o wide 2>/dev/null && break
          done
          echo
          kubectl get pod "$POD" -n default \
            -o jsonpath='{range .status.initContainerStatuses[*]}  {.name}: ready={.ready} state={.state}{"\n"}{end}' 2>/dev/null || true
