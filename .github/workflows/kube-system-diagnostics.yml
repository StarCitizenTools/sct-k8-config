name: Kube-system Diagnostics

# Read-only cluster-wide view for incidents where the default namespace looks
# healthy but everything fails: CoreDNS, node conditions, recent events, and
# resource pressure. Only `get`, `describe`, `top` and `logs`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v5
        with:
          version: '1.34'
      - uses: Azure/k8s-set-context@v5
        with:
          cluster-type: generic
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
      - name: Nodes
        run: |
          echo "=== nodes ==="; kubectl get nodes -o wide
          echo "=== node conditions ==="
          kubectl get nodes -o custom-columns='NODE:.metadata.name,READY:.status.conditions[?(@.type=="Ready")].status,MEM:.status.conditions[?(@.type=="MemoryPressure")].status,DISK:.status.conditions[?(@.type=="DiskPressure")].status,PID:.status.conditions[?(@.type=="PIDPressure")].status'
          echo "=== top nodes ==="; kubectl top nodes 2>&1 || true
      - name: All pods
        run: |
          echo "=== pods (all namespaces) ==="
          kubectl get pods -A -o wide
          echo "=== not-running / restarting ==="
          kubectl get pods -A --no-headers | awk '$4!="Running" || $5>0'
          echo "=== top pods ==="; kubectl top pods -A --sort-by=memory 2>&1 | head -30 || true
      - name: Describe non-Running default pods
        timeout-minutes: 2
        run: |
          for p in $(kubectl get pods -n default -o jsonpath='{range .items[?(@.status.phase!="Running")]}{.metadata.name}{"\n"}{end}' | grep -v -E "^cronjob-"); do
            echo "=== describe $p ==="
            kubectl describe pod "$p" -n default --request-timeout=20s 2>&1 | grep -E -A3 "^(Status|Reason|Message|Node):|State:|Reason:|Warning|Error|not found|Events:" | head -40
          done
          echo "=== secrets/configmaps in default ==="; kubectl get secrets,configmaps -n default --no-headers | awk '{print $1}'
      - name: Pods with many restarts (any namespace)
        timeout-minutes: 2
        run: |
          kubectl get pods -A -o json | python3 -c '
          import json,sys
          for p in json.load(sys.stdin)["items"]:
              for c in p["status"].get("containerStatuses",[]):
                  if c.get("restartCount",0) >= 100:
                      last=c.get("lastState",{}).get("terminated",{})
                      res=[x for x in p["spec"]["containers"] if x["name"]==c["name"]][0].get("resources",{})
                      print(p["metadata"]["namespace"], p["metadata"]["name"], c["name"],
                            "restarts=%s" % c["restartCount"],
                            "lastReason=%s exit=%s at=%s" % (last.get("reason"), last.get("exitCode"), last.get("finishedAt")),
                            "resources=%s" % json.dumps(res))
          '
      - name: Describe CrashLoopBackOff pods (any namespace)
        timeout-minutes: 3
        run: |
          kubectl get pods -A --no-headers | awk '$4=="CrashLoopBackOff" {print $1, $2}' | while read -r ns pod; do
            echo "=== describe $ns/$pod ==="
            kubectl describe pod "$pod" -n "$ns" --request-timeout=20s 2>&1 | grep -E -A4 "^\s+(State|Last State|Ready|Restart Count|Limits|Requests|Startup|Liveness|Readiness):" | head -60
            echo "--- last 60 log lines (current) ---"
            kubectl logs "$pod" -n "$ns" --all-containers --tail=60 --request-timeout=20s 2>&1 | tail -60
            echo "--- last 40 log lines (previous crash) ---"
            kubectl logs "$pod" -n "$ns" --all-containers --previous --tail=40 --request-timeout=20s 2>&1 | tail -40
          done
          echo "=== prometheusagent ownership (labels/annotations) + remoteWrite URL ==="
          kubectl get prometheusagent -A -o json 2>/dev/null | python3 -c '
          import json,sys
          for a in json.load(sys.stdin).get("items",[]):
              m=a["metadata"]; print(m["namespace"], m["name"], "labels=", json.dumps(m.get("labels",{})), "annotations=", json.dumps({k:v[:80] for k,v in m.get("annotations",{}).items()}))
              for rw in a["spec"].get("remoteWrite",[]): print("  remoteWrite", rw.get("name"), rw.get("url"), "queueConfig=", json.dumps(rw.get("queueConfig",{})))
              print("  additionalArgs=", json.dumps(a["spec"].get("additionalArgs",[])))
          '
          echo "=== remote write reachability from inside the cluster (via a php pod) ==="
          url=$(kubectl get prometheusagent -A -o jsonpath='{.items[0].spec.remoteWrite[0].url}' 2>/dev/null)
          pod=$(kubectl get pods -n default -l app=php-mediawiki --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          echo "url=$url via $pod"
          kubectl exec -n default "$pod" -c php-mediawiki --request-timeout=30s -- curl -sS -m 8 -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' -X POST "$url" 2>&1 || true
          echo "=== WAL size on the agent volume (best effort, container may be mid-replay) ==="
          kubectl exec -n monitoring prom-agent-prometheus-agent-0 -c prometheus --request-timeout=20s -- sh -c 'du -sh /prometheus /prometheus/wal 2>/dev/null; ls /prometheus/wal | wc -l; df -h /prometheus' 2>&1 || true
          echo "=== prometheusagent spec (probes/resources/storage) ==="
          kubectl get prometheusagent -A -o json 2>/dev/null | python3 -c '
          import json,sys
          for a in json.load(sys.stdin).get("items",[]):
              sp=a["spec"]; print(a["metadata"]["namespace"], a["metadata"]["name"])
              for k in ("maximumStartupDurationSeconds","resources","storage","remoteWrite","walCompression","version","image"):
                  if k in sp: print(" ", k, "=", json.dumps(sp[k])[:400])
          '
      - name: Volume attachments
        run: |
          echo "=== volumeattachments ==="; kubectl get volumeattachments -o wide
          echo "=== pvc ==="; kubectl get pvc -A
      - name: CoreDNS
        timeout-minutes: 2
        run: |
          echo "=== coredns deployment ==="; kubectl -n kube-system get deploy,svc -l k8s-app=kube-dns -o wide
          echo "=== coredns-autoscaler configmap ==="; kubectl -n kube-system get configmap coredns-autoscaler -o yaml | grep -v -E "^\s+(resourceVersion|uid|creationTimestamp):"
          echo "=== coredns endpoints ==="; kubectl -n kube-system get endpoints kube-dns -o wide
          echo "=== coredns pods ==="; kubectl -n kube-system get pods -l k8s-app=kube-dns -o wide
          echo "=== coredns describe (events/conditions) ==="
          kubectl -n kube-system describe pods -l k8s-app=kube-dns --request-timeout=20s | grep -E -A12 "^(Events|Conditions|State|Last State):" | head -80
          echo "=== coredns logs (last 40 lines each) ==="
          # Skip pods that are Terminating: logs from an unreachable node hang.
          for p in $(kubectl -n kube-system get pods -l k8s-app=kube-dns -o jsonpath='{range .items[?(!@.metadata.deletionTimestamp)]}{.metadata.name}{"\n"}{end}'); do echo "--- $p"; kubectl -n kube-system logs "$p" --tail=40 --all-containers --request-timeout=20s 2>&1 | tail -40; done
      - name: Recent events
        timeout-minutes: 2
        run: |
          echo "=== last 80 events (all namespaces) ==="
          kubectl get events -A --sort-by=.lastTimestamp 2>/dev/null | tail -80
