name: Delete Elasticsearch (one-shot retirement)

# ONE-SHOT teardown of the Elasticsearch left over from the OpenSearch migration.
#
# Why a workflow and not just deleting the manifest: CI applies WITHOUT prune,
# so removing mediawiki/elasticsearch.yaml stops the object being reconciled but
# does not delete the ECK Elasticsearch resource, its StatefulSet, its pod or its
# PVC. They would sit there indefinitely, holding ~10Gi of block storage.
#
# DESTRUCTIVE AND IRREVERSIBLE. This deletes the Elasticsearch data volume, which
# is the migration's rollback path. Until it runs, reverting is cheap: restore
# mediawiki/elasticsearch.yaml without the suspend annotation and point
# $wgCirrusSearchClusters back at elasticsearch-es-http. After it runs, going back
# means standing ES up empty and reindexing from scratch (~2h).
#
# Do NOT run this until OpenSearch has served production search cleanly for
# several days AND cronjob-mw-daily has logged "::: UpdateSuggesterIndex OK" on
# its own on more than one night.
#
# Delete this workflow file after the single run that uses it.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DELETE-ELASTICSEARCH to confirm destroying the ES data volume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: delete-elasticsearch
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      CONFIRM: ${{ inputs.confirm }}
      ES_PVC: elasticsearch-data-elasticsearch-es-elasticsearch-0
    steps:
      # kubectl pinned to the cluster's minor (apiserver v1.34.x) -- unpinned resolves
      # to latest stable, outside the supported +/-1 skew. Bump when LKE upgrades.
      - uses: azure/setup-kubectl@v5
        with:
          version: '1.34'

      - name: Kubernetes set context
        uses: Azure/k8s-set-context@v5
        with:
          cluster-type: generic
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Validate confirmation
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "DELETE-ELASTICSEARCH" ]; then
            echo "::error::Set 'confirm' to exactly DELETE-ELASTICSEARCH to proceed. Got: '$CONFIRM'"
            exit 1
          fi

      # Destroying the rollback path is only safe if the wiki demonstrably does
      # not depend on Elasticsearch, so check the cluster rather than trusting
      # anyone's memory of what was deployed.
      - name: Verify the wiki no longer depends on Elasticsearch
        run: |
          set -euo pipefail

          # 1. ES must be suspended (or already gone). If it is running, something
          #    re-enabled it and it may be serving queries.
          if kubectl get elasticsearch elasticsearch -n default >/dev/null 2>&1; then
            suspend=$(kubectl get elasticsearch elasticsearch -n default \
              -o jsonpath='{.metadata.annotations.eck\.k8s\.elastic\.co/suspend}' 2>/dev/null || true)
            if [ -z "$suspend" ]; then
              echo "::error::The Elasticsearch resource is NOT suspended -- it may still be serving. Refusing."
              exit 1
            fi
            echo "ES is suspended ($suspend)."
          else
            echo "ES resource already gone."
          fi

          # 2. OpenSearch must be Ready, i.e. there is a live backend to keep.
          kubectl wait --for=condition=Ready pod/opensearch-0 -n default --timeout=60s

          # 3. CirrusSearch's own check must pass against the configured cluster.
          #    Non-zero here means search is not healthy; do not remove the fallback
          #    while that is true.
          pod=$(kubectl get pods -l app=php-mediawiki \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')
          [ -n "$pod" ] || { echo "::error::no Running php-mediawiki pod"; exit 1; }
          kubectl exec "$pod" -c php-mediawiki -- \
            php /var/www/mediawiki/maintenance/run.php CirrusSearch:CheckIndexes
          echo "OK: OpenSearch is Ready and CheckIndexes passes."

      - name: Show what will be destroyed
        run: |
          set -uo pipefail
          kubectl get elasticsearch elasticsearch -n default -o wide || echo "(ECK resource already gone)"
          kubectl get pvc "$ES_PVC" -n default -o wide || echo "(PVC already gone)"
          kubectl get pods -l 'elasticsearch.k8s.elastic.co/cluster-name=elasticsearch' -n default -o wide || true

      - name: Delete
        run: |
          set -euo pipefail
          # ECK's default volumeClaimDeletePolicy (DeleteOnScaledownAndClusterDeletion)
          # should take the PVC with the cluster; the explicit delete below is the
          # fallback for a non-default policy or a PVC left behind by a finalizer.
          kubectl delete elasticsearch elasticsearch -n default --ignore-not-found
          kubectl delete pvc "$ES_PVC" -n default --ignore-not-found
          echo "Elasticsearch and its data volume are gone."

      - name: Confirm removal
        if: always()
        run: |
          set -uo pipefail
          echo "remaining Elasticsearch objects (expect none):"
          kubectl get elasticsearch -n default 2>/dev/null || true
          kubectl get pvc -n default 2>/dev/null | grep -i elasticsearch || echo "  no elasticsearch PVCs"
          kubectl get pv 2>/dev/null | grep -i elasticsearch || echo "  no elasticsearch PVs"
