name: Drop the leftover SMW tables

# Drops every `wikismw_` table after Extension:SemanticMediaWiki has already
# been removed from the deployed image. This is the second half of a permanent
# SMW uninstall; the first half is deploying an image without the extension.
#
# WHY NOT `setupStore --delete`: that script can only run while SMW is still
# installed, and the moment it finishes the wiki is serving SMW against tables
# that are gone -- every edit and uncached parse errors until a new image ships,
# which is a build, a bump PR and a rollout away. Removing the extension first
# costs nothing (the tables just sit there) and has no outage window at all.
# `$store->drop()` is also incomplete: it only knows currently-registered
# property tables, so it cannot see smw_ftp_sesp_pageimg, smw_ftp_sesp_userreg
# or smw_ftp_sesp_usereditcnt, left behind when SESP was removed. A prefix sweep
# catches those.
#
# The guard below REFUSES to run while SMW is still in the image. That is the
# whole safety model: with the extension gone the tables are inert, and dropping
# inert tables cannot break a request.
#
# Table names are never taken on trust. Whatever `SHOW TABLES` returns is
# filtered through ^wikismw_[A-Za-z0-9_]+$ before it can reach a DROP, so a
# surprising row cannot turn into a surprising statement.
#
# sql.php is used here the way bucket-db-setup.yml uses it: in a purpose-built
# workflow, on a statement this file builds. It stays off the
# run-mw-maintenance.yml allowlist, where the statement would be operator-typed.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List the tables without dropping anything"
        required: true
        default: true
        type: boolean
      confirm:
        description: Type "DROP SMW TABLES" to confirm (ignored on a dry run)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: smw-drop-tables
  cancel-in-progress: false

jobs:
  drop:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      # kubectl pinned to the cluster's minor (apiserver v1.34.x) -- unpinned resolves
      # to latest stable, outside the supported +/-1 skew. Bump when LKE upgrades.
      - uses: azure/setup-kubectl@v5
        with:
          version: '1.34'

      - name: Kubernetes Set Context
        uses: Azure/k8s-set-context@v5
        with:
          cluster-type: generic
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Confirm
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: the tables will be listed, nothing will be dropped."
            exit 0
          fi
          if [ "$CONFIRM" != "DROP SMW TABLES" ]; then
            echo "::error::confirm must be exactly \"DROP SMW TABLES\" when dry_run is unticked."
            exit 1
          fi

      - name: Resolve the pod
        id: pod
        run: |
          set -euo pipefail
          pod=$(kubectl get pods -l app=php-mediawiki \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$pod" ]; then
            echo "::error::No Running php-mediawiki pod found."
            exit 1
          fi
          echo "pod=$pod" >> "$GITHUB_OUTPUT"
          echo "pod: $pod"
          kubectl get pod "$pod" -o jsonpath='{"image="}{.spec.containers[?(@.name=="php-mediawiki")].image}{"\n"}'

      # The one guard that matters. While SMW is loaded these tables are live
      # data behind every page view; once it is gone they are inert.
      - name: Refuse if SMW is still deployed
        env:
          POD: ${{ steps.pod.outputs.pod }}
        run: |
          set -euo pipefail
          if kubectl exec "$POD" -c php-mediawiki -- \
            test -d /var/www/mediawiki/extensions/SemanticMediaWiki; then
            echo "::error::SemanticMediaWiki is still in the deployed image. Dropping its"
            echo "tables now would break every request until an SMW-less image ships."
            echo "Deploy that image first -- the tables are harmless in the meantime."
            exit 1
          fi
          echo "SemanticMediaWiki is not in the deployed image."

      # `\_` is escaped because _ is a LIKE wildcard. Quoted heredoc so the
      # backslash reaches MariaDB rather than being eaten by the shell.
      - name: List the tables
        id: list
        env:
          POD: ${{ steps.pod.outputs.pod }}
        run: |
          set -euo pipefail
          kubectl exec -i "$POD" -c php-mediawiki -- \
            php /var/www/mediawiki/maintenance/run.php sql <<'SQL' > /tmp/raw.txt
          SELECT table_name, table_rows, data_length + index_length AS bytes
          FROM information_schema.tables
          WHERE table_schema = DATABASE() AND table_name LIKE 'wikismw\_%'
          ORDER BY table_name;
          SQL

          echo "::group::information_schema"
          cat /tmp/raw.txt
          echo "::endgroup::"

          # Anchored on the trailing _ so a header echoing the pattern back as
          # `wikismw\_%` cannot be mistaken for a table.
          grep -oE 'wikismw_[A-Za-z0-9_]+' /tmp/raw.txt | sort -u > /tmp/tables.txt || true
          count=$(wc -l < /tmp/tables.txt)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo
          echo "$count table(s):"
          sed 's/^/  /' /tmp/tables.txt

      - name: Drop them
        if: ${{ inputs.dry_run == false }}
        env:
          POD: ${{ steps.pod.outputs.pod }}
          COUNT: ${{ steps.list.outputs.count }}
        run: |
          set -euo pipefail
          if [ "$COUNT" -eq 0 ]; then
            echo "Nothing to drop."
            exit 0
          fi

          # Re-validate every name against the strict pattern before it is
          # interpolated. Belt and braces: the extractor above already cannot
          # emit anything else, and this is the step that writes DDL.
          while read -r t; do
            case "$t" in
              wikismw_*) ;;
              *) echo "::error::refusing to drop unexpected table '$t'"; exit 1 ;;
            esac
            printf '%s\n' "$t" | grep -qE '^wikismw_[A-Za-z0-9_]+$' || {
              echo "::error::refusing to drop unexpected table '$t'"; exit 1; }
          done < /tmp/tables.txt

          list=$(sed 's/^/`/; s/$/`/' /tmp/tables.txt | paste -sd, -)
          echo "::warning::Dropping $COUNT SMW tables. This is not reversible."
          echo "DROP TABLE IF EXISTS $list;" > /tmp/drop.sql
          cat /tmp/drop.sql

          kubectl exec -i "$POD" -c php-mediawiki -- \
            php /var/www/mediawiki/maintenance/run.php sql < /tmp/drop.sql

      - name: Verify
        if: ${{ inputs.dry_run == false }}
        env:
          POD: ${{ steps.pod.outputs.pod }}
        run: |
          set -euo pipefail
          kubectl exec -i "$POD" -c php-mediawiki -- \
            php /var/www/mediawiki/maintenance/run.php sql <<'SQL' > /tmp/after.txt
          SHOW TABLES LIKE 'wikismw\_%';
          SQL

          left=$(grep -oE 'wikismw_[A-Za-z0-9_]+' /tmp/after.txt | sort -u || true)
          if [ -n "$left" ]; then
            echo "::error::these tables survived the drop:"
            echo "$left" | sed 's/^/  /'
            exit 1
          fi
          echo "No wikismw_ tables remain."
