version: 2

# Merging a PR here pushes to `smw`, which is the default branch AND the deploy
# trigger -- every merge rolls the production cluster. So the settings below are
# deliberately conservative: grouped PRs to keep the count low, and a cooldown so
# we never take a day-zero release. (actions/checkout v7.0.0 shipped 2026-07-16
# and v7.0.1 four days later with fixes; a cooldown skips straight to the latter.)

updates:
  # ---------------------------------------------------------------- actions --
  # Scans .github/workflows. These drifted a full major behind before anyone
  # noticed, because nothing was watching them.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    open-pull-requests-limit: 3
    cooldown:
      # Only `default-days` here: the per-semver-level keys are restricted to
      # SemVer-aware ecosystems, which github-actions and docker are not.
      default-days: 7
    groups:
      # One PR for the lot. They are always reviewed together anyway, and the
      # Azure k8s actions in particular move as a set.
      github-actions:
        patterns:
          - "*"

  # ----------------------------------------------------------------- images --
  # Docker image tags inside the Kubernetes manifests (Dependabot's `docker`
  # ecosystem reads Deployment/StatefulSet YAML, not just Dockerfiles).
  - package-ecosystem: docker
    directories:
      - "/mediawiki"
      - "/plausible"
      - "/shared"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # Our own images. They share one build stamp that must move in lockstep
      # across every manifest, which bump-app-images.yml handles; Dependabot
      # skipped /shared when it bumped these (PR #41). The name has no registry
      # prefix: Dependabot strips `ghcr.io/`, so `ghcr.io/starcitizentools/*`
      # never matched.
      - dependency-name: "starcitizentools/*"

      # Stateful singletons on a memory-constrained 2-node cluster: a major here
      # is a planned migration (data-dir format, schema, memory profile), not
      # something to land via an auto-merged manifest bump. Minor/patch still
      # flow through. Drop these two entries if you would rather see the PR and
      # decide case by case.
      - dependency-name: "mariadb"
        update-types: ["version-update:semver-major"]
      - dependency-name: "valkey/valkey"
        update-types: ["version-update:semver-major"]
      # Pinned to the exact version CirrusSearch requires.
      - dependency-name: "opensearchproject/opensearch"
    groups:
      # Images on the mariadb/valkey/opensearch pod templates, sidecars and init
      # containers included. A bump here restarts a singleton StatefulSet and
      # re-rolls its node placement (2026-09-10 outage), so it gets its own PR
      # to merge in a window, never on sight.
      stateful-images:
        patterns:
          - "mariadb"
          - "valkey/valkey"
          - "opensearchproject/opensearch"
          - "oliver006/redis_exporter"
          - "busybox"
      container-images:
        patterns:
          - "*"
